name: publish

# Publishes codemem-mcp to PyPI, then io.github.jeang42/codemem to the MCP Registry.
# Both use OIDC (PyPI Trusted Publishing, registry github-oidc login); there are no tokens.
# The PyPI trusted publisher is bound to this file name (publish.yml) and the "pypi" environment.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 0.1.0 (a leading v is stripped)"
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: version from the release tag
        id: version
        env:
          RAW: ${{ github.event.release.tag_name || inputs.version }}
        run: |
          V="${RAW#v}"
          if ! [[ "$V" =~ ^[0-9]+(\.[0-9]+)*([ab]|rc)?[0-9]*$ ]]; then
            echo "::error::'$RAW' is not a version tag"; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: stamp the version into codemem/__init__.py and server.json
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          # codemem/__init__.py is where pyproject.toml reads its version from.
          committed=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' codemem/__init__.py)
          if [ "$committed" != "$V" ]; then
            echo "::warning::committed version is $committed but the tag says $V; publishing $V. Bump it in the repo too."
          fi
          sed -i "s/^__version__ = .*/__version__ = \"$V\"/" codemem/__init__.py
          jq --arg v "$V" '.version = $v | .packages[].version = $v' server.json > server.tmp
          mv server.tmp server.json

      - name: build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check --strict dist/*

      - name: fail if the tag, the package and server.json disagree
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          built=$(python - <<'EOF'
          import email, glob, zipfile
          whl = glob.glob("dist/*.whl")[0]
          with zipfile.ZipFile(whl) as z:
              meta = next(n for n in z.namelist() if n.endswith(".dist-info/METADATA"))
              print(email.message_from_bytes(z.read(meta))["Version"])
          EOF
          )
          name=$(jq -r '.packages[0].identifier' server.json)
          echo "tag=$V wheel=$built server.json=$(jq -r .version server.json) package=$(jq -r '.packages[0].version' server.json) ($name)"
          test "$built" = "$V"
          test "$(jq -r .version server.json)" = "$V"
          test -z "$(jq -r --arg v "$V" '.packages[] | select(.version != $v) | .identifier' server.json)"
          ls dist | grep -q "^${name//-/_}-$V" || { echo "::error::dist/ is not $name $V"; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: server-json
          path: server.json
          if-no-files-found: error

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/codemem-mcp/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write   # Trusted Publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  mcp-registry:
    needs: [build, pypi]
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # mcp-publisher login github-oidc
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: server-json

      - name: wait until PyPI serves the new version
        env:
          V: ${{ needs.build.outputs.version }}
        run: |
          # The registry verifies ownership by reading the README on PyPI, so it must be live first.
          name=$(jq -r '.packages[0].identifier' server.json)
          for i in $(seq 1 40); do
            if curl -sf "https://pypi.org/pypi/$name/$V/json" > /dev/null; then
              echo "$name $V is on PyPI"; exit 0
            fi
            echo "waiting for $name $V on PyPI ($i/40)"; sleep 15
          done
          echo "::error::$name $V did not appear on PyPI within 10 minutes"; exit 1

      - name: install mcp-publisher
        run: |
          # Latest on purpose: an old binary is rejected by the registry ("invalid audience").
          curl -sfL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --version

      - name: publish to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
