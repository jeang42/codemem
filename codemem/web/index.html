<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>codemem</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--fg:#1c1f26;--muted:#6b7280;--line:#e3e6eb;--accent:#2563eb;--chip:#eef2ff;--chipfg:#3730a3;--warn:#b45309;--code:#f1f3f6}
:root[data-theme=dark]{--bg:#0f1218;--panel:#171b23;--fg:#e6e8ee;--muted:#8b93a3;--line:#2a2f3a;--accent:#7aa2ff;--chip:#1e2540;--chipfg:#b7c4ff;--warn:#f0b35a;--code:#0c0f14}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1218;--panel:#171b23;--fg:#e6e8ee;--muted:#8b93a3;--line:#2a2f3a;--accent:#7aa2ff;--chip:#1e2540;--chipfg:#b7c4ff;--warn:#f0b35a;--code:#0c0f14}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
header{display:flex;gap:12px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header h1{font-size:16px;margin:0 8px 0 0}header h1 span{color:var(--muted);font-weight:400;font-size:12px;margin-left:6px}
nav a{padding:6px 10px;border-radius:6px;color:var(--fg)}nav a.on{background:var(--chip);color:var(--chipfg)}
.grow{flex:1}input,select,button,textarea{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 9px}
input[type=search]{min-width:280px}button{cursor:pointer}button.del{float:right;opacity:.35;font-size:11px;padding:2px 7px}button.del:hover,button.del:focus{opacity:1;color:#fff;background:#a33025;border-color:#a33025}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
main{padding:18px;max-width:1300px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.card h3{margin:0 0 4px;font-size:15px}.muted{color:var(--muted);font-size:12px}
.chip{display:inline-block;background:var(--chip);color:var(--chipfg);border-radius:999px;padding:1px 8px;font-size:11px;margin:2px 3px 0 0}
.kind{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12px;color:var(--muted)}
.wrap{overflow-x:auto}pre,code{background:var(--code);border-radius:6px;font-size:12.5px}pre{padding:10px;overflow:auto;white-space:pre-wrap}code{padding:1px 4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:900px){.two{grid-template-columns:1fr}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.stat{display:inline-block;padding:8px 14px;background:var(--panel);border:1px solid var(--line);border-radius:8px;margin:0 8px 8px 0}.stat b{display:block;font-size:20px}
.note{border-left:3px solid var(--accent);padding-left:10px;margin:10px 0}.note.session-auto{border-color:var(--muted)}
.dirty{color:var(--warn)}
.review{margin-top:6px;padding:8px 10px;border-radius:6px;background:var(--code);font-size:12.5px}.review .risk{color:var(--warn)}.review .lbl{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.mat{display:inline-block;border-radius:4px;padding:0 6px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:#fff;background:var(--muted)}
.tr{display:inline-block;border-radius:4px;padding:0 6px;font-size:11px;font-weight:600;color:#fff;background:#6b7280}.tr.hi{background:#15803d}.tr.mid{background:#a16207}.tr.lo{background:#b91c1c}
.mat.authoritative{background:#15803d}.mat.usable{background:#2563eb}.mat.experimental{background:#7c3aed}.mat.antiquated{background:#a16207}.mat.sunset{background:#c2410c}.mat.broken{background:#b91c1c}.mat.junk{background:#525252}details summary{cursor:pointer}
.md p{margin:.5em 0}.md h1,.md h2,.md h3,.md h4{margin:1em 0 .4em}.md h1{font-size:20px}.md h2{font-size:17px}.md h3{font-size:15px}
.md table{width:auto;margin:.6em 0;display:block;overflow-x:auto}.md th,.md td{border:1px solid var(--line);padding:4px 8px}.md ul,.md ol{padding-left:1.4em}.md li{margin:.15em 0}
.md blockquote{border-left:3px solid var(--line);margin:.6em 0;padding:.1em .8em;color:var(--muted)}.md pre{white-space:pre}.md hr{border:0;border-top:1px solid var(--line)}
</style>
</head>
<body>
<header>
  <h1>codemem<span id="machine"></span></h1>
  <nav>
    <a href="#/" data-v="home">Overview</a><a href="#/projects" data-v="projects">Projects</a><a href="#/assets" data-v="assets">Assets</a>
    <a href="#/notes" data-v="notes">Notes</a><a href="#/activity" data-v="activity">Activity</a><a href="#/docs" data-v="docs">Docs</a>
  </nav>
  <div class="grow"></div>
  <form id="sform" onsubmit="return goSearch(event)"><input type="search" id="q" placeholder="search everything…"></form>
  <label class="muted" title="Comma list of project audiences to hide, e.g. unrestricted">hide <input id="exclude" size="9" placeholder="audience"></label>
  <label class="muted" title="Comma list of maturity ratings to hide, e.g. junk,broken,sunset">hide <input id="exmat" size="11" placeholder="maturity"></label>
  <label class="muted" title="Include cloned third-party repos"><input type="checkbox" id="vendor"> vendor</label>
  <button id="theme" title="toggle theme">◐</button>
</header>
<main id="main"></main>
<script src="/web/marked.min.js"></script>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const root=document.documentElement;
const MATS=['authoritative','usable','experimental','antiquated','sunset','broken','junk'];
try{const t=localStorage.getItem('theme');if(t)root.dataset.theme=t;$('#exclude').value=localStorage.getItem('exclude')||'';$('#exmat').value=localStorage.getItem('exmat')||''}catch(e){}
$('#exmat').onchange=e=>{try{localStorage.setItem('exmat',e.target.value)}catch(_){}route()};
$('#vendor').onchange=()=>route();
$('#theme').onclick=()=>{const dark=root.dataset.theme==='dark'||(!root.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);root.dataset.theme=dark?'light':'dark';try{localStorage.setItem('theme',root.dataset.theme)}catch(e){}};
$('#exclude').onchange=e=>{try{localStorage.setItem('exclude',e.target.value)}catch(_){}route()};
const ex=()=>{const v=$('#exclude').value.trim(),m=$('#exmat').value.trim();return (v?'&exclude_audience='+encodeURIComponent(v):'')+(m?'&exclude_maturity='+encodeURIComponent(m):'')+($('#vendor').checked?'&include_vendor=1&origin=all':'')};
const mat=(m,note)=>m?`<span class="mat ${esc(m)}" title="${esc(note||'')}">${esc(m)}</span>`:'';
const trust=(r)=>{if(r==null||r.trust==null)return '';let b={};try{b=JSON.parse(r.trust_breakdown||'{}')}catch(e){}
  const tip=Object.entries(b).map(([k,v])=>v===true?`[${k}]`:`${k} ${v}`).join(', ')+(r.verified_at?` · verified ${d10(r.verified_at)}`:'');
  return `<span class="tr ${r.trust>=70?'hi':r.trust>=40?'mid':'lo'}" title="${esc(tip)}">trust ${r.trust}</span>`};
async function doDeleteNote(id){if(!confirm('Delete this note?\n\nIt is removed from the database, the search index and the embeddings. Notes are a dated record \u2014 to correct one that is merely out of date, add a newer note instead.'))return;const r=await fetch('/api/note/'+id,{method:'DELETE'});if(!r.ok){alert('Could not delete that note.');return}route()}
async function doVerify(name,kind){const note=prompt('What did you check? (optional)')||'';await fetch('/api/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,asset_kind:kind||'',note})});route()}
const matSel=(name,cur)=>`<select name="${name}"><option value="">unrated</option>${MATS.map(x=>`<option ${x===cur?'selected':''}>${x}</option>`).join('')}</select>`;
const api=async(p)=>{const r=await fetch('/api'+p);if(!r.ok)throw new Error(r.status);return r.json()};
const chips=t=>(t||'').split(',').filter(Boolean).map(x=>`<span class="chip">${esc(x)}</span>`).join('');
const d10=s=>(s||'').slice(0,10);
const md=s=>{try{return marked.parse(String(s??''),{gfm:true,breaks:false})}catch(e){return `<pre>${esc(s)}</pre>`}};
function goSearch(e){e.preventDefault();location.hash='#/search/'+encodeURIComponent($('#q').value);return false}
const V={
 async home(){const s=await api('/stats');$('#machine').textContent=s.machine+':'+s.port;
  const a=await api('/activity?days=7'+ex());
  return `<div>${['projects','assets','notes','commits','docs','links'].map(k=>`<span class="stat"><b>${s[k]}</b>${k}</span>`).join('')}
  <span class="stat"><b>${s.embedded_rows}/${s.index_rows}</b>embedded</span><span class="stat"><b>${(s.trust||[]).map(x=>x.n+' '+x.band.split(' ')[0]).join(' / ')}</b>trust (own projects)</span><span class="stat"><b>${s.machines.length}</b>machines: ${esc(s.machines.join(', '))}</span></div>
  <div class="two"><div class="card"><h3>Commits, last 7 days</h3>${tbl(a.commits.slice(0,25),['date','project','message','pushed_from'])}</div>
  <div class="card"><h3>Sessions & notes, last 7 days</h3>${a.notes.slice(0,25).map(n=>noteHtml(n)).join('')||'<p class="muted">none yet</p>'}</div></div>
  <div class="card" style="margin-top:14px"><h3>Scan roots</h3>${tbl(s.scan_roots,['machine','path','enabled','last_scanned'])}
  <p class="muted">Audiences: ${s.audiences.map(x=>`${esc(x.audience)} (${x.n})`).join(', ')}. Maturity: ${s.maturity.map(x=>`${esc(x.maturity)} (${x.n})`).join(', ')}. Origin: ${s.origins.map(x=>`${esc(x.origin)} (${x.n})`).join(', ')}. MCP endpoint: <code>http://${location.host}/mcp</code></p></div>`},
 async projects(){const st=$('#f_status')?.value||'',tag=$('#f_tag')?.value||'',fm=$('#f_mat')?.value||'';const r=await api(`/projects?status=${st}&tag=${encodeURIComponent(tag)}&maturity=${fm}${ex()}`);
  return `<div class="row"><select id="f_status" onchange="route()"><option value="">any status</option>${['active','paused','done','abandoned','archived'].map(x=>`<option ${x===st?'selected':''}>${x}</option>`).join('')}</select>
  <select id="f_mat" onchange="route()"><option value="">any maturity</option>${MATS.map(x=>`<option ${x===fm?'selected':''}>${x}</option>`).join('')}</select>
  <input id="f_tag" placeholder="tag" value="${esc(tag)}" onchange="route()"><span class="muted">${r.count} projects</span></div>
  <div class="grid">${r.projects.map(p=>`<div class="card"><h3><a href="#/project/${encodeURIComponent(p.name)}">${esc(p.name)}</a> ${mat(p.maturity,p.maturity_note)} ${trust(p)} ${p.origin==='vendor'?'<span class="chip">vendor</span>':''}</h3>
  <div class="muted">${esc(p.status)} · ${esc(p.audience)} · ${p.commit_count||0} commits${p.last_commit?' · '+d10(p.last_commit):''}</div>
  <div>${esc(p.description||'').slice(0,160)}</div><div>${chips(p.tags)}${chips(p.languages)}</div></div>`).join('')}</div>`},
 async project(name){const b=await api('/project/'+encodeURIComponent(name));const p=b.project;
  return `<h2>${esc(p.name)} ${mat(p.maturity,p.maturity_note)} ${trust(p)} ${p.origin==='vendor'?'<span class="chip">vendor clone</span>':''} <span class="muted">${esc(p.status)} · ${esc(p.audience)} · ${esc(p.visibility||'private')}</span> <button onclick="doVerify('${esc(p.name)}')" title="I ran it today and it works">verified today</button></h2>
  ${p.trust!=null?`<p class="muted">trust breakdown: ${esc(Object.entries(JSON.parse(p.trust_breakdown||'{}')).map(([k,v])=>v===true?`[${k}]`:`${k} ${v}`).join(' · '))}${p.verified_at?' · verified '+d10(p.verified_at)+(p.verified_note?' ('+esc(p.verified_note)+')':''):''}</p>`:''}${p.maturity_note?`<p class="muted">${esc(p.maturity_note)}</p>`:''}
  <div class="two"><div><div class="card"><h3>About</h3><p>${esc(p.description)||'<span class="muted">no description</span>'}</p>${p.purpose?`<p><b>Purpose:</b> ${esc(p.purpose)}</p>`:''}
  <div>${chips(p.tags)}</div><p class="muted">languages: ${esc(p.languages)}<br>${p.remote_url?`git: <code>${esc(p.remote_url)}</code><br>`:''}${p.gitea_url?`<a href="${esc(p.gitea_url)}" target="_blank">gitea</a> `:''}${p.github_url?`<a href="${esc(p.github_url)}" target="_blank">github</a>`:''}</p>
  <details><summary>edit</summary><form onsubmit="return saveProject(event,'${esc(p.name)}')">
  <p><input name="description" placeholder="description" value="${esc(p.description)}" style="width:100%"></p><p><input name="purpose" placeholder="purpose" value="${esc(p.purpose)}" style="width:100%"></p>
  <p><input name="tags" placeholder="tags" value="${esc(p.tags)}"> <select name="status">${['active','paused','done','abandoned','archived'].map(x=>`<option ${x===p.status?'selected':''}>${x}</option>`).join('')}</select> <input name="audience" placeholder="audience" value="${esc(p.audience)}" size="10"> <select name="visibility">${['private','shared','public'].map(x=>`<option ${x===(p.visibility||'private')?'selected':''}>${x}</option>`).join('')}</select> <select name="origin"><option ${p.origin==='own'?'selected':''}>own</option><option ${p.origin==='vendor'?'selected':''}>vendor</option></select></p>
  <p>${matSel('maturity',p.maturity)} <input name="maturity_note" placeholder="why / what to use instead" value="${esc(p.maturity_note)}" style="width:55%"> <button class="primary">save</button></p></form></details></div>
  <div class="card"><h3>Locations</h3>${b.locations.map(l=>`<div><b>${esc(l.machine)}</b> <code>${esc(l.path)}</code> ${l.branch?esc(l.branch):''} ${l.dirty?'<span class="dirty">dirty</span>':''}<div class="muted">${esc(l.languages||'')} · ${esc(l.key_files||'')} · scanned ${d10(l.last_scanned)}</div>${l.readme_head?`<details><summary class="muted">readme</summary><pre>${esc(l.readme_head)}</pre></details>`:''}</div>`).join('')||'<p class="muted">not seen on any machine yet</p>'}</div>
  <div class="card"><h3>Assets</h3>${b.assets.map(assetHtml).join('')||'<p class="muted">none registered</p>'}</div>
  <div class="card"><h3>Links</h3>${b.links.map(l=>`<div>${esc(l.from_name)} <b>${esc(l.relation)}</b> ${esc(l.to_name)} <span class="muted">${esc(l.note)}</span></div>`).join('')||'<p class="muted">none</p>'}</div></div>
  <div><div class="card"><h3>Notes & sessions</h3>${b.notes.map(noteHtml).join('')||'<p class="muted">none yet</p>'}</div>
  <div class="card"><h3>Commits (${p.commit_count||0})</h3><div class="wrap">${tbl(b.commits,['date','hash','message','author','pushed_from'])}</div></div></div></div>`},
 async assets(){const k=$('#f_kind')?.value||'',tg=$('#f_atag')?.value||'',pj=$('#f_aproj')?.value||'',so=$('#f_asort')?.value||'updated';
  const r=await api(`/assets?kind=${k}&tag=${encodeURIComponent(tg)}&project=${encodeURIComponent(pj)}${ex()}`);const kinds=[...new Set(r.assets.map(a=>a.kind))].sort();
  const rows=r.assets.slice().sort((a,b)=>so==='changed'?String(b.last_changed||'').localeCompare(String(a.last_changed||'')):so==='churn'?(b.change_count||0)-(a.change_count||0):so==='trust'?(b.trust??-1)-(a.trust??-1):so==='name'?a.name.localeCompare(b.name):0);
  return `<div class="row"><select id="f_kind" onchange="route()"><option value="">any kind</option>${kinds.map(x=>`<option ${x===k?'selected':''}>${x}</option>`).join('')}</select>
  <input id="f_atag" placeholder="tag (auto-discovered, …)" value="${esc(tg)}" onchange="route()"><input id="f_aproj" placeholder="project" value="${esc(pj)}" onchange="route()">
  <select id="f_asort" onchange="route()">${[['updated','recently updated'],['trust','trust'],['changed','last code change'],['churn','most commits'],['name','name']].map(([v,l])=>`<option value="${v}" ${v===so?'selected':''}>${l}</option>`).join('')}</select>
  <span class="muted">${rows.length} assets</span></div><div class="grid">${rows.map(a=>`<div class="card">${assetHtml(a)}</div>`).join('')}</div>`},
 async notes(){const k=$('#f_nkind')?.value||'';const r=await api(`/notes?kind=${k}${ex()}`);
  return `<div class="row"><select id="f_nkind" onchange="route()"><option value="">any kind</option>${['handoff','session','session-auto','decision','howto','resource','issue','idea','note'].map(x=>`<option ${x===k?'selected':''}>${x}</option>`).join('')}</select><span class="muted">${r.notes.length} notes</span></div>${r.notes.map(noteHtml).join('')}`},
 async activity(){const d=$('#f_days')?.value||14;const a=await api(`/activity?days=${d}${ex()}`);
  return `<div class="row"><label>days <input id="f_days" type="number" value="${d}" min="1" style="width:70px" onchange="route()"></label></div>
  <div class="two"><div class="card"><h3>Commits</h3><div class="wrap">${tbl(a.commits,['date','project','message','author','pushed_from'])}</div></div><div class="card"><h3>Notes</h3>${a.notes.map(noteHtml).join('')||'<p class="muted">none</p>'}</div></div>`},
 async docs(id){if(id){const d=await api('/docs?id='+id);return `<p><a href="#/docs">← docs</a></p><h2>${esc(d.title)}</h2><p class="muted">${esc(d.source)} · ${d10(d.updated_at)}</p><div class="card md">${md(d.body)}</div>`}
  const r=await api('/docs');return `<div class="card">${tbl(r.docs.map(d=>({...d,title:`<a href="#/docs/${d.id}">${esc(d.title)}</a>`})),['title','source','size','updated_at'],true)}</div>`},
 async search(qs){$('#q').value=qs;const r=await api(`/search?q=${encodeURIComponent(qs)}&limit=40${ex()}`);
  return `<p class="muted">${r.results?.length||0} results · mode ${esc(r.mode||'')}</p>${(r.results||[]).map(x=>{const rec=x.record;
   const title=x.kind==='project'?`<a href="#/project/${encodeURIComponent(rec.name)}">${esc(rec.name)}</a>`:x.kind==='doc'?`<a href="#/docs/${rec.id}">${esc(rec.title)}</a>`:x.kind==='commit'?`${esc(rec.project)} <code>${esc(rec.hash.slice(0,8))}</code>`:esc(rec.name||rec.title);
   const body=x.kind==='asset'?`${esc(rec.description)} <code>${esc(rec.usage||'')}</code>`:x.kind==='location'?`${esc(rec.machine)}:<code>${esc(rec.path)}</code>`:x.kind==='commit'?esc(rec.message):esc((rec.body||rec.excerpt||rec.description||'').slice(0,400));
   return `<div class="card" style="margin-bottom:8px"><span class="kind">${x.kind}</span> ${mat(rec.maturity||rec.effective_maturity,rec.maturity_note)} ${rec.project&&x.kind!=='project'?`<a class="muted" href="#/project/${encodeURIComponent(rec.project)}">${esc(rec.project)}</a>`:''}<h3>${title}</h3><div>${body}</div></div>`}).join('')}`}
};
function tbl(rows,cols,raw){if(!rows?.length)return '<p class="muted">none</p>';return `<table><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr>${rows.map(r=>`<tr>${cols.map(c=>{let v=r[c];if(c==='date'||c==='last_scanned')v=d10(v);if(c==='hash')v=`<code>${esc(String(v).slice(0,8))}</code>`;else if(c==='project')v=`<a href="#/project/${encodeURIComponent(v)}">${esc(v)}</a>`;else if(!raw||c!=='title')v=esc(v);return `<td>${v??''}</td>`}).join('')}</tr>`).join('')}</table>`}
function reviewHtml(a){if(!a.review)return '';let r={};try{r=JSON.parse(a.review)}catch(e){return ''}
  return `<details class="review" open><summary class="lbl">model review · ${esc(r.confidence||'')} confidence · ${d10(a.reviewed_at)}</summary>
  ${r.what_it_does?`<div>${esc(r.what_it_does)}</div>`:''}${(r.risks||[]).length?`<div class="lbl" style="margin-top:4px">risks</div><ul style="margin:2px 0 4px;padding-left:18px">${r.risks.map(x=>`<li class="risk">${esc(x)}</li>`).join('')}</ul>`:''}${r.reuse?`<div><span class="lbl">reuse</span> ${esc(r.reuse)}</div>`:''}</details>`}
function assetHtml(a){return `<div><span class="kind">${esc(a.kind)}</span> <b>${esc(a.name)}</b> ${mat(a.maturity||a.effective_maturity,a.maturity_note)} ${trust(a)} ${a.project?`<a class="muted" href="#/project/${encodeURIComponent(a.project)}">${esc(a.project)}</a>`:''}<div>${esc(a.description)}</div>${a.usage?`<div><code>${esc(a.usage)}</code></div>`:''}<div class="muted">${esc(a.machine||'')}${a.path?':'+esc(a.path):''}${a.last_changed?' · changed '+d10(a.last_changed)+(a.change_count?' ('+a.change_count+' commits)':''):''}</div><div>${chips(a.tags)}</div>${reviewHtml(a)}
<details><summary class="muted">rate</summary><form onsubmit="return saveAsset(event,${a.id})">${matSel('maturity',a.maturity)} <input name="maturity_note" placeholder="why" value="${esc(a.maturity_note||'')}"> <button>save</button> <button type="button" onclick="doVerify('${esc(a.name)}','${esc(a.kind)}')">verified today</button></form></details></div>`}
async function saveAsset(e,id){e.preventDefault();const f=new FormData(e.target);const d={};for(const [k,v] of f)d[k]=v;await fetch('/api/asset/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});route();return false}
function noteHtml(n){return `<div class="note ${esc(n.kind)}"><span class="kind">${esc(n.kind)}</span> <b>${esc(n.title)}</b> <span class="muted">${d10(n.created_at)} · ${esc(n.machine||'')}${n.project?' · <a href="#/project/'+encodeURIComponent(n.project)+'">'+esc(n.project)+'</a>':''}</span><details><summary class="muted">${esc((n.body||'').split('\n')[0].slice(0,140))}</summary><div class="md">${md(n.body)}</div></details>${chips(n.tags)} <button class="del" title="delete this note" onclick="doDeleteNote(${n.id})">delete</button></div>`}
async function saveProject(e,name){e.preventDefault();const f=new FormData(e.target);const d={};for(const [k,v] of f)d[k]=v;await fetch('/api/project/'+encodeURIComponent(name),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});route();return false}
async function route(){const h=location.hash.replace(/^#\/?/,'');const [v,...rest]=h.split('/');const arg=decodeURIComponent(rest.join('/'));const fn=V[v]||V.home;
 document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===(v||'home')));
 try{$('#main').innerHTML=await fn(arg)}catch(err){$('#main').innerHTML=`<p class="dirty">error: ${esc(err.message)}</p>`}}
addEventListener('hashchange',route);route();
</script>
